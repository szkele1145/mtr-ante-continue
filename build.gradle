import org.apache.tools.ant.filters.ReplaceTokens

import java.time.Instant

plugins {
	id "architectury-plugin" version "3.4.160"
	id "dev.architectury.loom" version "1.10.431" apply false
	id "de.undercouch.download" version "4.1.2"
	id "com.github.johnrengelman.shadow" version "8.1.1"
	id "io.github.pacifistmc.forgix" version "1.2.9"
	id "base"
}

ext {
    graaljsVersion = "24.2.2"// 22.3.0 24.2.1 23.0.8
}

apply from: "build_dep_ver.gradle"

rootProject.ext.assetExcludeFont = rootProject.properties.containsKey("assetExcludeFont")

architectury {
	minecraft = minecraft_version
}

// [续更] 仓库声明保持在 loom 插件应用之后（原始布局）：
// loom 配置期只用其内部仓库，项目仓库在全部插件应用完毕后一次性声明，
// 避免 Gradle 8.10+ 的"使用后突变"检查（提前声明反而会触发该问题）

configure(subprojects) {
	apply plugin: "dev.architectury.loom"

	loom {
		silentMojangMappingsLicense()
	}

	configurations {
		shadowCommon
	}

	dependencies {
		compileOnly("com.github.stuxuhai:jpinyin:1.1.7")
		implementation 'org.joml:joml:+'
		compileOnly("me.shedaniel.cloth:basic-math:+")
		annotationProcessor 'systems.manifold:manifold-preprocessor:+'
		minecraft "com.mojang:minecraft:${minecraft_version}"
		mappings parchment_version == "" ? loom.officialMojangMappings() : loom.layered() {
			officialMojangMappings()
			parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
		}
		implementation files("../checkouts/${minecraft_version}/mtr-common.jar")
		implementation "org.msgpack:msgpack-core:${rootProject.messagepack_version}"

		compileOnly("org.graalvm.polyglot:polyglot:${graaljsVersion}")
		compileOnly("org.graalvm.polyglot:js:${graaljsVersion}")
		compileOnly("org.graalvm.truffle:truffle-api:${graaljsVersion}")
		compileOnly("org.graalvm.truffle:truffle-runtime:${graaljsVersion}")

		if (name == "fabric") {
			if (!project.hasProperty('excludeGraal') || !project.property('excludeGraal').toBoolean()) {
				shadowCommon("org.graalvm.polyglot:polyglot:${graaljsVersion}")
				shadowCommon("org.graalvm.polyglot:js:${graaljsVersion}")

				shadowCommon("org.graalvm.truffle:truffle-api:${graaljsVersion}")
				shadowCommon("org.graalvm.truffle:truffle-runtime:${graaljsVersion}")
			}
			shadowCommon("com.github.stuxuhai:jpinyin:1.1.7")
		}
	}

	build.finalizedBy(mergeJars)
	assemble.finalizedBy(mergeJars)
}

task setupLibrary() {

	String url = "https://aphrodite281.github.io/Minecraft-Transit-Railway-3.x.x/lib/" + minecraft_version + "/"

	def files = [
			["mtr-common.jar", "checkouts/${minecraft_version}/mtr-common.jar"],
			["mtr-fabric.jar", "checkouts/${minecraft_version}/mtr-fabric.jar"],
			["mtr-forge.jar", "checkouts/${minecraft_version}/mtr-forge.jar"],
			["files.zip", "checkouts/${minecraft_version}/files.zip"]
	]

	files.each { name, dest ->
		tasks.register("downloadSetup${name.capitalize()}", de.undercouch.gradle.tasks.download.Download) {
			src "${url}${name}"
			dest dest
			overwrite false
			onlyIf { !file(dest).exists() }
			doFirst {
				if (!file(dest).exists()) {
					println "Downloading $name ..."
				} else {
					println "Skipping $name - already exists"
				}
			}
		}
	}

	doFirst {
		// no-op; downloads run as separate up-to-date tasks
	}
}

build {
	doFirst {

		copy {
			// outputs.upToDateWhen { false }
			from(zipTree("checkouts/${minecraft_version}/files.zip")) { eachFile { file -> file.relativePath = new RelativePath(true, file.relativePath.segments.drop(1) as String[]) } }
			into "common/src/main/java/cn/zbx1425/mtrsteamloco/mappings"
			filter(ReplaceTokens, tokens: ["package": "cn.zbx1425.mtrsteamloco.mappings; import mtr.mappings.*"])
		}

		ant.path { ant.fileset(dir: "common/src/main/java/cn/zbx1425/mtrsteamloco/mappings", includes: "Fabric*.java") }.list().each {
			ant.move(file: it, todir: "fabric/src/main/java/cn/zbx1425/mtrsteamloco/mappings")
		}

		ant.path { ant.fileset(dir: "common/src/main/java/cn/zbx1425/mtrsteamloco/mappings", includes: "Forge*.java") }.list().each {
			ant.move(file: it, todir: "forge/src/main/java/cn/zbx1425/mtrsteamloco/mappings")
		}

		ant.delete(dir: "common/src/main/java/cn/zbx1425/mtrsteamloco/mappings")
		ant.delete(dir: "forge/build/libs")
	}
	copy {
		outputs.upToDateWhen { false }
		from "checkouts/${minecraft_version}/mtr-fabric.jar"
		into "fabric/run/mods"
	}

	copy {
		outputs.upToDateWhen { false }
		from "checkouts/${minecraft_version}/mtr-forge.jar"
		into "forge/run/mods"
	}

	copy {
		outputs.upToDateWhen { false }
		from "common/src/main/BuildConfigTemplate.java"
		into "common/src/main/java/cn/zbx1425/mtrsteamloco"
		filter(ReplaceTokens, tokens: [
				"version": rootProject.mod_version + "+" + minecraft_version,
				"protocol_version": rootProject.mod_protocol_version,
				"build_time": Instant.now().epochSecond.toString()
		])
		rename "(.+)Template.java", "\$1.java"
	}
}

tasks.named('build') {
    mustRunAfter 'setupLibrary'  // 强制顺序
}

configure(allprojects) {
	apply plugin: "architectury-plugin"

	version = rootProject.mod_version + "+" + minecraft_version
	group = project.maven_group

	// [续更] 国内镜像（保持原始脚本位置：所有插件应用完毕后声明，规避仓库突变检查）
	// mavenLocal：预下载的 GraalVM/Loom 构件，绕开 repo.maven.apache.org 的不稳定 TLS
	repositories {
		mavenLocal()
		maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
		maven { url = "https://maven.aliyun.com/repository/public/" }
		maven { url = "https://bmclapi2.bangbang93.com/maven/" }
		maven { url = "https://maven.terraformersmc.com/" }
		maven { url = "https://maven.parchmentmc.org/" }
		maven { url "https://maven.shedaniel.me"}
		maven { url "https://repo1.maven.org/maven2/" }
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"
    	options.incremental = true;
		

		if (minecraft_main_version == 16) {
			def targetVersion = 8
			if (JavaVersion.current().isJava9Compatible()) {
				options.release.set(targetVersion)
			}
		} else if (minecraft_main_version == 17) {
			options.release.set(16)
		} else {
			options.release.set(17)
		}

        options.compilerArgs += ['-Xplugin:Manifold', '-AMC_VERSION=' + minecraft_version_int]
		if (project.hasProperty("debug") && project.property('debug').toBoolean()) {
			options.compilerArgs += ['-ADEBUG=true']
		}
	}
}

forgix {
	group = "cn.zbx1425"
	mergedJarName = "MTR-ANTE" + "-" + rootProject.mod_version + "+" + minecraft_version + ".jar"
	outputDir = "build/"

	forge {
		projectName = "forge"
		jarLocation = "build/libs/forge" + "-" + rootProject.mod_version + "+" + minecraft_version + ".jar"
	}

	fabric {
		projectName = "fabric"
		jarLocation = "build/libs/fabric" + "-" + rootProject.mod_version + "+" + minecraft_version + ".jar"
	}
}

import org.gradle.api.internal.file.copy.CopyAction;
import org.gradle.api.internal.file.copy.CopyActionProcessingStream;

class DummyArchiveTask extends AbstractArchiveTask {

	protected CopyAction createCopyAction() {
		return new DummyCopyAction();
	}

	class DummyCopyAction implements CopyAction {

		@Override
		WorkResult execute(CopyActionProcessingStream stream) {
			return WorkResults.didWork(true);
		}
	}
}

tasks.register('dummyForgixOutput', DummyArchiveTask) {
	// Forgix's mergeJars task doesn't extend AbstractArchiveTask.
	// This is to make github.com/teaconmc/longjing happy.

	destinationDirectory = file("build/")
	archiveBaseName = "MTR-ANTE"
	archiveVersion = rootProject.mod_version + "+" + minecraft_version
	archiveExtension = "jar"
}

tasks.withType(JavaCompile) {
    outputs.cacheIf { true }
    options.incremental = true;
}

// [验证 2026-10-21] 审查项 #9 —— 脚本执行超时机制的可执行验证。
// 独立 Java 程序（不依赖 MC），用真实 GraalVM 24.2.2 证明：
//   1) 死循环脚本确实停不下来（问题真实存在）；
//   2) Context.interrupt(Duration) 能在有限时间内中断它；
//   3) 抛出 PolyglotException（ante 既有的 catch (Exception) 能接住）；
//   4) 中断后 context 仍可继续执行后续脚本；
//   5) 正常长脚本不会被误杀；
// [验证 2026-10-21 continue.5] 看门狗线程爆炸优化的回归断言：
//   6) 提前完成的脚本不会被中断（isDone 短路生效），context 仍可用；
//   7) 超时脚本被中断并退出，抛 PolyglotException；
//   8) 连续 1000 次调度后看门狗线程数仍为 1（未线程爆炸）。
tasks.register('verifyScriptTimeout', JavaExec) {
    group = 'verification'
    description = '验证审查项 #9 与 continue.5 看门狗线程数断言（JS 脚本执行超时）'

    // GraalVM 依赖声明在 common 子项目（compileOnly），根项目没有 runtimeClasspath。
    // 且 org.graalvm.polyglot:js 是 POM-only 聚合件，真正的 JS 语言实现是
    // org.graalvm.js:js-language —— compileClasspath 里不会有它，必须显式补。
    def commonProject = project(':common')
    def graaljsVersion = rootProject.ext.graaljsVersion
    def graalCp = commonProject.configurations.detachedConfiguration(
            commonProject.dependencies.create("org.graalvm.polyglot:polyglot:${graaljsVersion}"),
            commonProject.dependencies.create("org.graalvm.js:js-language:${graaljsVersion}"),
            commonProject.dependencies.create("org.graalvm.truffle:truffle-api:${graaljsVersion}"),
            commonProject.dependencies.create("org.graalvm.truffle:truffle-runtime:${graaljsVersion}")
    )
    def cp = graalCp.files.collect { it.absolutePath }.join(File.pathSeparator)

    def srcFile = file('tools/VerifyScriptTimeout.java')
    def outDir = layout.buildDirectory.dir('verify-script-timeout').get().asFile

    inputs.file(srcFile)
    outputs.dir(outDir)

    doFirst {
        outDir.mkdirs()
        // 只编译这一份独立程序（不依赖 MC classpath）。
        // 用 JDK 自带的 javax.tools.JavaCompiler（不引 Ant 的嵌套 src 语法坑）。
        def compiler = javax.tools.ToolProvider.getSystemJavaCompiler()
        if (compiler == null) {
            throw new GradleException('需要 JDK（不是 JRE）来编译 VerifyScriptTimeout.java')
        }
        def fileManager = compiler.getStandardFileManager(null, null, null)
        def units = fileManager.getJavaFileObjects(srcFile)
        def options = [
                '-classpath', cp,
                '-d', outDir.absolutePath,
                '-encoding', 'UTF-8',
                '-nowarn'
        ] as List
        def task = compiler.getTask(null, fileManager, null, options, null, units)
        def ok = task.call()
        fileManager.close()
        if (!ok) {
            throw new GradleException('VerifyScriptTimeout.java 编译失败')
        }
    }

    // 注意：Groovy 里不要写 outDir + File.pathSeparator + cp
    // （File 没有 plus 运算符），用 files(...) 组合。
    classpath = files(outDir.toURI(), graalCp)
    mainClass = 'VerifyScriptTimeout'
}

// [验证 2026-10-22 continue.6] 滚转排序缓存的**并发可见性**与**数组配对**保证。
// 独立 Java 程序（不依赖 MC、不依赖 GraalVM），验证：
//   1) 旧的双字段实现（写端 values→keys / 读端 keys→values，均无 volatile）
//      在读写交错下能观察到「长度不一致的数组对」；
//   2) 旧实现在同场景下能复现 AIOOBE（越界）与 NPE（读到 null）；
//   3) 新的「不可变 holder + 单 volatile 字段」实现**永远配对**、无异常；
//   4) holder 失效（置 null）后能读到新数据（可见性语义正确）。
tasks.register('verifyRollCacheVisibility', JavaExec) {
    group = 'verification'
    description = '验证 continue.6 滚转排序缓存的并发可见性与数组配对（不依赖 MC / GraalVM）'

    def srcFile = file('tools/VerifyRollCacheVisibility.java')
    def outDir = layout.buildDirectory.dir('verify-roll-cache').get().asFile

    inputs.file(srcFile)
    outputs.dir(outDir)

    doFirst {
        outDir.mkdirs()
        def compiler = javax.tools.ToolProvider.getSystemJavaCompiler()
        if (compiler == null) {
            throw new GradleException('需要 JDK（不是 JRE）来编译 VerifyRollCacheVisibility.java')
        }
        def fileManager = compiler.getStandardFileManager(null, null, null)
        def units = fileManager.getJavaFileObjects(srcFile)
        def options = [
                '-d', outDir.absolutePath,
                '-encoding', 'UTF-8',
                '-nowarn'
        ] as List
        def task = compiler.getTask(null, fileManager, null, options, null, units)
        def ok = task.call()
        fileManager.close()
        if (!ok) {
            throw new GradleException('VerifyRollCacheVisibility.java 编译失败')
        }
    }

    classpath = files(outDir.toURI())
    mainClass = 'VerifyRollCacheVisibility'
}


