# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx6G -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 代理：[修复 2026-10-21] 原为「保持为空（直接连接，避免本地代理 TLS 握手失败）」，
# 但直连 piston-data.mojang.com 会被中间盒截断：
#   SSLException (bad_record_mac) Tag mismatch —— 收到 5766584/46592587 字节即断。
#   PowerShell/curl 走同一网络却正常 ⇒ 是 JVM 的 TLS 指纹被中间盒误伤。
# 改走本地代理（与 mtr-next 的 git 配置同一套），Loom 下载即走代理隧道。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65532
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65532
systemProp.http.nonProxyHosts=localhost|127.0.0.1
# org.gradle.parallel=true
org.gradle.caching=true

# org.gradle.parallel=false
org.gradle.daemon=false
# org.gradle.configureondemand=true   

# Mod Properties
# [续更] continue.5：JS 脚本超时看门狗线程爆炸修复
#   （startWatchdog 每次调用新建 2 个线程 ⇒ 每帧每脚本 120 线程/秒；
#    改为静态 ScheduledExecutorService + schedule 一次性任务，线程数恒为 1）
# [续更] continue.3：审查报告 5 项修复（#7 CONFIG_INFO 双重转义 / #8 boundingBox
# volatile / #10 finishCallback finally / #11 删死代码 / #13 root toRealPath /
# #14 resetRunner awaitTermination）+ 构建环境修复（java.home / 代理 / build.ps1）
mod_version=1.1.1-continue.5
mod_protocol_version=11
maven_group=cn.zbx1425.mtrsteamloco

mtr_version=latest
mtr_min_version=3.1.12
messagepack_version=0.9.0

# [续更] 网络不稳：仓库下载重试（Gradle 内部参数）
org.gradle.internal.repository.max.tentatives=10
org.gradle.internal.repository.initial.backoff=1500

# [续更] Gradle 守护进程直接跑在完整 JDK17 上（CI 同版本；默认 java 是 JRE21 无 javac）
# [修复 2026-10-21] 原为 Z:/jdk17 —— Z: 由 mtr-next 的 build.ps1 临时 subst 并立即删除，
# 本工程独立构建（IDE 导入 / CI / 别人的 gradlew）时该路径不存在，必然失败。
# 改用永久存在的 C:/jdk17（junction → C:\Users\一只屑\.jdks\ms-17.0.19）。
org.gradle.java.home=C:/jdk17
org.gradle.java.installations.paths=C:/jdk17
