# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx6G -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 代理保持为空（直接连接，避免本地代理 TLS 握手失败；参考 mtr-next 策略）
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
systemProp.http.nonProxyHosts=localhost|127.0.0.1|mirrors.cloud.tencent.com|maven.aliyun.com|bmclapi2.bangbang93.com|maven.minecraftforge.net
# org.gradle.parallel=true
org.gradle.caching=true

# org.gradle.parallel=false
org.gradle.daemon=false
# org.gradle.configureondemand=true   

# Mod Properties
mod_version=1.1.1-continue.2
mod_protocol_version=11
maven_group=cn.zbx1425.mtrsteamloco

mtr_version=latest
mtr_min_version=3.1.12
messagepack_version=0.9.0

# [续更] 网络不稳：仓库下载重试（Gradle 内部参数）
org.gradle.internal.repository.max.tentatives=10
org.gradle.internal.repository.initial.backoff=1500

# [续更] Gradle 守护进程直接跑在完整 JDK17 上（CI 同版本；默认 java 是 JRE21 无 javac）
org.gradle.java.home=Z:/jdk17
org.gradle.java.installations.paths=F:/tools/jdk17
